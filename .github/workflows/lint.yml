name: lint

# Every job calls the same steps as the pre-commit hook: scripts/check.sh owns
# the step -> command mapping, and this workflow is the host-PHP adapter.
# Canonical table: ./scripts/check.sh list.

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: PHP syntax check
        run: ./scripts/check.sh lint

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Formatting guard
        run: ./scripts/check.sh style

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: _output JSON + addon version
        run: ./scripts/check.sh artifacts

  balance-writes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Only the ledger module writes balances
        run: ./scripts/check.sh balance-writes

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check contract smoke test
        run: ./scripts/check.sh test-dev
      - name: PR comments smoke test
        run: ./scripts/check.sh test-pr-comments

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Diff-aware PR scan; the working-tree equivalent is `check.sh secrets`.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install deps
        working-directory: qa
        run: composer install --no-interaction
      - name: Unit tests
        run: ./scripts/check.sh unit

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install deps
        working-directory: qa
        run: composer install --no-interaction
      - name: Static analysis
        run: ./scripts/check.sh stan

  # NOTE: jobs needing the licensed XF runtime (xf-addon:validate-json,
  # build-release smoke, PHPUnit, Setup-step tests) cannot run in public CI
  # and stay local: see docs/DEV.md "Release checklist".
