name: lint

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: PHP syntax check
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" || fail=1
          done < <(find addon-src qa -name '*.php' -not -path '*/vendor/*')
          exit $fail
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: _output JSON + addon version
        # Same script the pre-commit hook runs; see scripts/check-artifacts.py.
        run: python3 scripts/check-artifacts.py

  balance-writes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only Transact writes balances
        run: ./scripts/check-balance-writes.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dev.sh arg handling smoke test
        run: ./scripts/test-dev.sh

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install deps and run unit tests
        working-directory: qa
        run: |
          composer install --no-interaction
          ./vendor/bin/phpunit

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install deps and run static analysis
        working-directory: qa
        run: |
          composer install --no-interaction
          ./vendor/bin/phpstan analyse --no-progress

  # NOTE: jobs needing the licensed XF runtime (xf-addon:validate-json,
  # build-release smoke, PHPUnit, Setup-step tests) cannot run in public CI
  # and stay local: see docs/DEV.md "Release checklist".
