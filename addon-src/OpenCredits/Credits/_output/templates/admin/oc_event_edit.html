<xf:title><xf:if is="$event.isInsert()">{{ phrase('ocadm_add_event') }}<xf:else />{{ phrase('ocadm_edit_event_x', {'trigger': $event.trigger}) }}</xf:if></xf:title>

<xf:form action="{{ $event.isInsert() ? link('oc-events/save') : link('oc-events/save', $event) }}" class="block" ajax="true">
	<div class="block-container">
		<div class="block-body">
			<xf:selectrow name="currency_id" value="{$event.currency_id}" label="{{ phrase('ocadm_currency') }}">
				<xf:foreach loop="$currencies" value="$currency">
					<xf:option value="{$currency.currency_id}">{$currency.title}</xf:option>
				</xf:foreach>
			</xf:selectrow>

			<xf:selectrow name="trigger" value="{$event.trigger}" label="{{ phrase('ocadm_trigger') }}"
				hint="{{ phrase('ocadm_trigger_hint') }}">
				<xf:foreach loop="$triggers" key="$key" value="$label">
					<xf:option value="{$key}">{$label}</xf:option>
				</xf:foreach>
			</xf:selectrow>

			<xf:textboxrow name="amount" value="{$event.amount}" label="{{ phrase('oc_amount') }}" type="number" step="0.01"
				hint="{{ phrase('ocadm_amount_hint') }}" />

			<xf:numberboxrow name="max_per_day" value="{$event.max_per_day}" label="{{ phrase('ocadm_max_per_day') }}"
				min="0" hint="{{ phrase('ocadm_max_hint') }}" />

			<xf:textboxrow name="forum_ids" value="{$eventForumIds}" label="{{ phrase('ocadm_only_forums') }}"
				placeholder="{{ phrase('ocadm_forum_placeholder') }}"
				hint="{{ phrase('ocadm_forum_hint') }}" />

			<xf:checkboxrow name="usergroup_ids[]" label="{{ phrase('ocadm_only_groups') }}"
				hint="{{ phrase('ocadm_groups_hint') }}">
				<xf:foreach loop="$userGroups" value="$userGroup">
					<xf:option value="{$userGroup.user_group_id}" selected="{{ in_array($userGroup.user_group_id, $eventGroupIds) }}"
						label="{$userGroup.title}" />
				</xf:foreach>
			</xf:checkboxrow>

			<xf:checkboxrow>
				<xf:option name="active" selected="$event.active" label="{{ phrase('ocadm_active') }}" />
			</xf:checkboxrow>

			<xf:checkboxrow>
				<xf:option name="send_alert" selected="$event.send_alert" label="{{ phrase('ocadm_send_alert') }}"
					hint="{{ phrase('ocadm_alert_hint') }}" />
			</xf:checkboxrow>
		</div>
		<xf:submitrow submit="{{ phrase('ocadm_save') }}" />
	</div>
</xf:form>
