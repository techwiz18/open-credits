<xf:title>Earning events</xf:title>

<xf:pageaction>
	<xf:button href="{{ link('oc-events/add') }}" icon="add">Add event</xf:button>
</xf:pageaction>

<xf:if is="$events is not empty">
	<div class="block">
		<div class="block-container">
			<div class="block-body">
				<xf:datalist>
					<xf:foreach loop="$events" value="$event">
						<xf:datarow
							label="{$event.display_label}"
							hint="{$event.display_hint}"
							href="{{ link('oc-events/edit', $event) }}"
							delete="{{ link('oc-events/delete', $event) }}" />
					</xf:foreach>
				</xf:datalist>
			</div>
			<div class="block-footer">
				<span class="block-footer-counter">{{ display_totals($events) }}</span>
			</div>
		</div>
	</div>
<xf:else />
	<div class="blockMessage">No earning events yet.</div>
</xf:if>
