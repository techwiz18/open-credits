<xf:title>{{ phrase('ocadm_earning_events') }}</xf:title>

<xf:pageaction>
	<xf:button href="{{ link('oc-events/add') }}" icon="add">{{ phrase('ocadm_add_event') }}</xf:button>
</xf:pageaction>

<xf:if is="$groups is not empty">
	<xf:foreach loop="$groups" value="$group">
		<div class="block">
			<div class="block-container">
				<h3 class="block-header">{$group.currency.title} <span class="u-muted">({$group.sample})</span></h3>
				<div class="block-body">
					<xf:datalist>
						<xf:foreach loop="$group.events" value="$event">
							<xf:datarow
								label="{$event.display_label}"
								hint="{$event.display_hint}"
								href="{{ link('oc-events/edit', $event) }}"
								delete="{{ link('oc-events/delete', $event) }}" />
						</xf:foreach>
					</xf:datalist>
				</div>
			</div>
		</div>
	</xf:foreach>
	<div class="block">
		<div class="block-container">
			<div class="block-footer">
				<span class="block-footer-counter">{{ phrase('ocadm_x_events', {'count': $total|number}) }}</span>
			</div>
		</div>
	</div>
<xf:else />
	<div class="blockMessage">{{ phrase('ocadm_no_events') }}</div>
</xf:if>
