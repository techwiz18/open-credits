<xf:title>{{ phrase('ocadm_rebuild_title') }}</xf:title>

<div class="block">
	<div class="block-container">
		<xf:if is="$ran">
			<div class="block-body">
				<div class="block-row block-row--separated">
					{{ phrase('ocadm_rebuilt_x', {'count': $rows|number}) }}
				</div>
			</div>
			<div class="block-footer">
				<a href="{{ link('oc-tools') }}" class="button">{{ phrase('ocadm_back_to_tools') }}</a>
			</div>
		<xf:else />
			<xf:form action="{{ link('oc-tools/rebuild') }}" class="block" ajax="true">
				<div class="block-body">
					<div class="block-row block-row--separated">
						{{ phrase('ocadm_rebuild_explain') }}
					</div>
				</div>
				<xf:submitrow submit="{{ phrase('ocadm_rebuild_now') }}" />
			</xf:form>
		</xf:if>
	</div>
</div>
