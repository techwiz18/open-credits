<hr class="formRowSep" />

<xf:numberboxrow name="options[limit]" value="{$options.limit}" min="1"
	label="{{ phrase('ocadm_widget_limit') }}" />

<xf:selectrow name="options[currency_id]" value="{$options.currency_id}"
	label="{{ phrase('ocadm_widget_currency') }}">
	<xf:option value="0">{{ phrase('ocadm_widget_currency_primary') }}</xf:option>
	<xf:foreach loop="$currencies" value="$currency">
		<xf:option value="{$currency.currency_id}">{$currency.title}</xf:option>
	</xf:foreach>
</xf:selectrow>

<xf:checkboxrow label="{{ phrase('ocadm_widget_guest_visibility') }}"
	hint="{{ phrase('ocadm_widget_show_guests_hint') }}">
	<xf:option name="options[show_guests]" value="1" selected="{$options.show_guests}">
		{{ phrase('ocadm_widget_show_guests') }}
	</xf:option>
</xf:checkboxrow>
