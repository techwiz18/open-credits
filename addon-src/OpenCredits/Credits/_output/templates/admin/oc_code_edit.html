<xf:title><xf:if is="$code.isInsert()">Add code<xf:else />Edit code: {$code.code}</xf:if></xf:title>

<xf:form action="{{ $code.isInsert() ? link('oc-codes/save') : link('oc-codes/save', $code) }}" class="block" ajax="true">
	<div class="block-container">
		<div class="block-body">
			<xf:textboxrow name="code" value="{$code.code}" label="Code" maxlength="32"
				hint="Blank generates a random code. Stored uppercase letters A-Z and digits 2-9 — 0, 1, dashes and spaces are stripped, so avoid 0/1." />

			<xf:selectrow name="currency_id" value="{$code.currency_id}" label="Currency">
				<xf:foreach loop="$currencies" value="$currency">
					<xf:option value="{$currency.currency_id}">{$currency.title}</xf:option>
				</xf:foreach>
			</xf:selectrow>

			<xf:textboxrow name="amount" value="{$code.amount}" label="Amount" type="number" step="0.01"
				hint="Credits granted per redemption. Must be positive." />

			<xf:numberboxrow name="max_uses" value="{$code.max_uses}" label="Total redemptions"
				min="0" hint="How many times this code can be redeemed in total. 0 = unlimited. Each member can still only redeem it once." />

			<xf:textboxrow name="expiry" value="{{ $code.expiry_date ? date($code.expiry_date, 'Y-m-d') : '' }}" label="Expiry date"
				placeholder="YYYY-MM-DD — blank means never" />

			<xf:if is="!$code.isInsert()">
				<xf:formrow label="Used so far">{$code.use_label}</xf:formrow>
			</xf:if>

			<xf:checkboxrow>
				<xf:option name="active" selected="$code.active" label="Active" />
			</xf:checkboxrow>
		</div>
		<xf:submitrow submit="Save" />
	</div>
</xf:form>
