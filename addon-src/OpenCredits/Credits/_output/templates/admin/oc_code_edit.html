<xf:title><xf:if is="$code.isInsert()">{{ phrase('ocadm_add_code') }}<xf:else />{{ phrase('ocadm_edit_code_x', {'code': $code.code}) }}</xf:if></xf:title>

<xf:form action="{{ $code.isInsert() ? link('oc-codes/save') : link('oc-codes/save', $code) }}" class="block" ajax="true">
	<div class="block-container">
		<div class="block-body">
			<xf:textboxrow name="code" value="{$code.code}" label="{{ phrase('oc_code') }}" maxlength="32"
				hint="{{ phrase('ocadm_code_hint') }}" />

			<xf:selectrow name="currency_id" value="{$code.currency_id}" label="{{ phrase('ocadm_currency') }}">
				<xf:foreach loop="$currencies" value="$currency">
					<xf:option value="{$currency.currency_id}">{$currency.title}</xf:option>
				</xf:foreach>
			</xf:selectrow>

			<xf:textboxrow name="amount" value="{$code.amount}" label="{{ phrase('oc_amount') }}" type="number" step="0.01"
				hint="{{ phrase('ocadm_code_amount_hint') }}" />

			<xf:numberboxrow name="max_uses" value="{$code.max_uses}" label="{{ phrase('ocadm_max_total') }}"
				min="0" hint="{{ phrase('ocadm_code_max_hint') }}" />

			<xf:textboxrow name="expiry" value="{{ $code.expiry_date ? date($code.expiry_date, 'Y-m-d') : '' }}" label="{{ phrase('ocadm_expiry') }}"
				placeholder="{{ phrase('ocadm_expiry_placeholder') }}" />

			<xf:if is="!$code.isInsert()">
				<xf:formrow label="{{ phrase('ocadm_used_so_far') }}">{$code.use_label}</xf:formrow>
			</xf:if>

			<xf:checkboxrow>
				<xf:option name="active" selected="$code.active" label="{{ phrase('ocadm_active') }}" />
			</xf:checkboxrow>
		</div>
		<xf:submitrow submit="{{ phrase('ocadm_save') }}" />
	</div>
</xf:form>
