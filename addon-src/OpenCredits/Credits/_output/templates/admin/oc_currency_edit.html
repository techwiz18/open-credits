<xf:title><xf:if is="$currency.isInsert()">{{ phrase('ocadm_add_currency') }}<xf:else />{{ phrase('ocadm_edit_currency_x', {'title': $currency.title}) }}</xf:if></xf:title>

<xf:form action="{{ $currency.isInsert() ? link('oc-currencies/save') : link('oc-currencies/save', $currency) }}" class="block" ajax="true">
	<div class="block-container">
		<div class="block-body">
			<xf:textboxrow name="title" value="{$currency.title}" label="{{ phrase('ocadm_title') }}" required="true"
				hint="{{ phrase('ocadm_title_hint') }}" />

			<xf:textboxrow name="prefix" value="{$currency.prefix}" label="{{ phrase('ocadm_prefix') }}"
				hint="{{ phrase('ocadm_prefix_hint') }}" />

			<xf:textboxrow name="suffix" value="{$currency.suffix}" label="{{ phrase('ocadm_suffix') }}"
				hint="{{ phrase('ocadm_suffix_hint') }}" />

			<xf:numberboxrow name="decimals" value="{$currency.decimals}" label="{{ phrase('ocadm_decimals') }}" min="0" max="2"
				hint="{{ phrase('ocadm_decimals_hint') }}" />

			<xf:checkboxrow>
				<xf:option name="allow_negative" selected="$currency.allow_negative"
					label="{{ phrase('ocadm_allow_negative') }}"
					hint="{{ phrase('ocadm_allow_negative_hint') }}" />
				<xf:option name="active" selected="$currency.active"
					label="{{ phrase('ocadm_active') }}" hint="{{ phrase('ocadm_currency_active_hint') }}" />
				<xf:option name="visible" selected="$currency.visible"
					label="{{ phrase('ocadm_visible') }}" hint="{{ phrase('ocadm_visible_hint') }}" />
				<xf:option name="is_primary" selected="$currency.is_primary"
					label="{{ phrase('ocadm_primary') }}" hint="{{ phrase('ocadm_primary_hint') }}" />
			</xf:checkboxrow>
		</div>
		<xf:submitrow submit="{{ phrase('ocadm_save') }}" />
	</div>
</xf:form>
