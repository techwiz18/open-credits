<xf:title>{{ phrase('ocadm_currencies') }}</xf:title>

<xf:pageaction>
	<xf:button href="{{ link('oc-currencies/add') }}" icon="add">{{ phrase('ocadm_add_currency') }}</xf:button>
</xf:pageaction>

<xf:if is="$currencies is not empty">
	<div class="block">
		<div class="block-container">
			<div class="block-body">
				<xf:datalist>
					<xf:foreach loop="$currencies" value="$currency">
						<xf:datarow
							label="{$currency.title}"
							hint="{{ phrase('ocadm_currency_sample_x', {'sample': $currency.prefix . 1|number($currency.decimals) . $currency.suffix, 'decimals': $currency.decimals}) }}"
							href="{{ link('oc-currencies/edit', $currency) }}"
							delete="{{ link('oc-currencies/delete', $currency) }}" />
					</xf:foreach>
				</xf:datalist>
			</div>
			<div class="block-footer block-footer--split">
				<span class="block-footer-counter">{{ phrase('ocadm_currency_stats', {'c': $currencyCount|number, 'e': $eventCount|number, 't': $transactionCount|number, 'm': $memberCount|number}) }}</span>
				<span class="block-footer-opposite">
					<a href="{{ link('oc-tools') }}" class="button button--small">{{ phrase('ocadm_tools_title') }}</a>
				</span>
			</div>
		</div>
	</div>
<xf:else />
	<div class="blockMessage">{{ phrase('ocadm_no_currencies') }}</div>
</xf:if>
