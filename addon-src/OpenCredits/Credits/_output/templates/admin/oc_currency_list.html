<xf:title>Currencies</xf:title>

<xf:pageaction>
	<xf:button href="{{ link('oc-currencies/add') }}" icon="add">Add currency</xf:button>
</xf:pageaction>

<xf:if is="$currencies is not empty">
	<div class="block">
		<div class="block-container">
			<div class="block-body">
				<xf:datalist>
					<xf:foreach loop="$currencies" value="$currency">
						<xf:datarow
							label="{$currency.title}"
							hint="{$currency.prefix}1.00{$currency.suffix} - {$currency.decimals} decimals"
							href="{{ link('oc-currencies/edit', $currency) }}"
							delete="{{ link('oc-currencies/delete', $currency) }}" />
					</xf:foreach>
				</xf:datalist>
			</div>
			<div class="block-footer block-footer--split">
				<span class="block-footer-counter">{$currencyCount|number} currencies · {$eventCount|number} events · {$transactionCount|number} ledger rows · {$memberCount|number} members with balances</span>
				<span class="block-footer-opposite">
					<a href="{{ link('oc-tools') }}" class="button button--small">Tools</a>
				</span>
			</div>
		</div>
	</div>
<xf:else />
	<div class="blockMessage">No currencies yet.</div>
</xf:if>
