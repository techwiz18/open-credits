<div class="blockMessage blockMessage--important oc-charge">
	<div class="oc-charge-head">
		<xf:fa icon="fa-lock" aria-hidden="true" />
		{{ phrase('oc_charge_locked_title') }}
	</div>
	<div class="oc-charge-body">
		<xf:if is="$isGuest">
			<div>{{ phrase('oc_charge_login', {'price': $price}) }}</div>
			<a href="{{ link('login') }}" class="button button--primary">{{ phrase('log_in') }}</a>
		<xf:else />
			<div>{{ phrase('oc_charge_price_hint', {'price': $price}) }}</div>
			<xf:if is="$canAfford">
				<xf:form action="{{ link('credits/unlock') }}" class="oc-charge-form">
					<input type="hidden" name="content_type" value="{$contentType}" />
					<input type="hidden" name="content_id" value="{$contentId}" />
					<input type="hidden" name="amount" value="{$amount}" />
					<button type="submit" class="button button--primary">{{ phrase('oc_charge_unlock_for_x', {'price': $price}) }}</button>
				</xf:form>
			<xf:else />
				<div class="blockMessage blockMessage--warning">{{ phrase('oc_charge_insufficient', {'balance': $balanceFormatted, 'price': $price}) }}</div>
			</xf:if>
		</xf:if>
	</div>
</div>
