<xf:title>{{ phrase('oc_redeem_a_code') }}</xf:title>

<div class="block">
	<div class="block-container">
		<xf:if is="$ran">
			<div class="block-body">
				<div class="block-row block-row--separated">
					{{ phrase('oc_redeemed_x', {'amount': $currency.prefix . $amount|number($currency.decimals) . $currency.suffix, 'currency': $currency.title}) }}
				</div>
			</div>
			<div class="block-footer">
				<a href="{{ link('credits', '', {'currency_id': $currency.currency_id}) }}" class="button button--primary">{{ phrase('oc_view_history') }}</a>
				<a href="{{ link('credits/redeem') }}" class="button">{{ phrase('oc_redeem_another') }}</a>
			</div>
		<xf:else />
			<xf:form action="{{ link('credits/redeem-save') }}" class="block" ajax="true">
				<div class="block-body">
					<div class="block-row block-row--separated">
						{{ phrase('oc_redeem_explain') }}
					</div>
					<xf:textboxrow name="code" value="{$code}" label="{{ phrase('oc_code') }}"
						placeholder="XXXX-XXXX-XXXX" required="required" maxlength="32" />
				</div>
				<xf:submitrow submit="{{ phrase('oc_redeem') }}" />
			</xf:form>
		</xf:if>
	</div>
</div>
